name: harness
on:
  push:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, review_requested, review_request_removed, assigned, unassigned]

jobs:
  reconcile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core scope — deterministic boundary (agent review is manual)
        if: github.event_name == 'pull_request'
        env:
          CORE_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          CORE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha }}
          CORE_SCOPE_BRANCH: ${{ github.head_ref }}
        run: python3 automation/check_core_scope.py --range "$CORE_SCOPE_BASE...$CORE_SCOPE_HEAD" --branch "$CORE_SCOPE_BRANCH"
      - name: Reconciler — pull-request merge boundary
        if: github.event_name == 'pull_request'
        env:
          QUEUE_TASK_BRANCH: ${{ github.head_ref }}
          QUEUE_CHANGE_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          QUEUE_DISPLACED_TIP: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
        run: |
          QUEUE_DISPLACED_ARGS=()
          if [ -n "$QUEUE_DISPLACED_TIP" ] && \
              [ "$QUEUE_DISPLACED_TIP" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "$QUEUE_DISPLACED_TIP^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$QUEUE_DISPLACED_TIP"
            fi
            git cat-file -e "$QUEUE_DISPLACED_TIP^{commit}"
            QUEUE_DISPLACED_ARGS=(--displaced-tip "$QUEUE_DISPLACED_TIP")
          fi
          python3 automation/reconcile/reconcile.py --check \
            --at-transition merge \
            --branch "$QUEUE_TASK_BRANCH" \
            --range "$QUEUE_CHANGE_RANGE" \
            "${QUEUE_DISPLACED_ARGS[@]}"
      - name: Action projection — pull-request questions are queued
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          ACTION_PROJECTION_BODY: ${{ github.event.pull_request.body }}
          ACTION_PROJECTION_TITLE: ${{ github.event.pull_request.title }}
          ACTION_PROJECTION_REQUESTED_REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers) }}
          ACTION_PROJECTION_REQUESTED_TEAMS: ${{ toJSON(github.event.pull_request.requested_teams) }}
          ACTION_PROJECTION_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees) }}
          ACTION_PROJECTION_BRANCH: ${{ github.head_ref }}
          ACTION_PROJECTION_CANDIDATE_REVISION: ${{ github.sha }}
          ACTION_PROJECTION_REVISION_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          python3 automation/check_action_projection.py \
            --from-env ACTION_PROJECTION_BODY \
            --additional-prose-env ACTION_PROJECTION_TITLE \
            --external-action-env ACTION_PROJECTION_REQUESTED_REVIEWERS \
            --external-action-env ACTION_PROJECTION_REQUESTED_TEAMS \
            --external-action-env ACTION_PROJECTION_ASSIGNEES \
            --action-section "What to review" \
            --branch "$ACTION_PROJECTION_BRANCH" \
            --candidate-revision "$ACTION_PROJECTION_CANDIDATE_REVISION" \
            --allowed-url-prefix "$ACTION_PROJECTION_REVISION_URL" \
            --label pull-request-description
      - name: Reconciler — every harness invariant holds
        if: github.event_name == 'push'
        env:
          QUEUE_PUSH_BEFORE: ${{ github.event.before }}
          QUEUE_PUSH_HEAD: ${{ github.sha }}
          QUEUE_PUSH_BRANCH: ${{ github.ref_name }}
          QUEUE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          QUEUE_DISPLACED_ARGS=()
          if [ "$QUEUE_PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            if [ "$QUEUE_PUSH_BRANCH" = "$QUEUE_DEFAULT_BRANCH" ]; then
              QUEUE_CHANGE_RANGE="root:$QUEUE_PUSH_HEAD"
            elif QUEUE_PUSH_BASE="$(git merge-base "$QUEUE_PUSH_HEAD" "origin/$QUEUE_DEFAULT_BRANCH")"; then
              QUEUE_CHANGE_RANGE="$QUEUE_PUSH_BASE...$QUEUE_PUSH_HEAD"
            else
              QUEUE_CHANGE_RANGE="root:$QUEUE_PUSH_HEAD"
            fi
          else
            if ! git cat-file -e "$QUEUE_PUSH_BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$QUEUE_PUSH_BEFORE"
            fi
            git cat-file -e "$QUEUE_PUSH_BEFORE^{commit}"
            QUEUE_CHANGE_RANGE="$QUEUE_PUSH_BEFORE...$QUEUE_PUSH_HEAD"
            QUEUE_DISPLACED_ARGS=(--displaced-tip "$QUEUE_PUSH_BEFORE")
          fi
          python3 automation/reconcile/reconcile.py --check \
            --branch "$QUEUE_PUSH_BRANCH" \
            --range "$QUEUE_CHANGE_RANGE" \
            "${QUEUE_DISPLACED_ARGS[@]}"
      - name: Repository tests
        if: ${{ always() }}
        run: python3 automation/run_tests.py
